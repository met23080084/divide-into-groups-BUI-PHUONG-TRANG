<div class="container">
    <h1>Group Builder</h1>
    
    <div class="input-group">
        <input type="text" id="nameInput" placeholder="Name(s) separated by comma">
        <button class="btn-add" onclick="addStudent()">Add</button>
    </div>
    
    <!-- Updated list display for a cleaner UI -->
    <div id="studentList" style="margin-bottom: 1rem; display: flex; flex-wrap: wrap; gap: 8px;"></div>

    <label>Number of Groups:</label>
    <input type="number" id="groupCount" value="3" min="1" style="width: 60px;">
    
    <button class="btn-create" onclick="generateGroups()">Create Random Groups</button>
    <div id="results"></div>
</div>

<script>
    let students = JSON.parse(localStorage.getItem('students')) || [];

    function renderList() {
        const list = document.getElementById('studentList');
        list.innerHTML = students.map((s, i) => `
            <span style="background:#e0e0ff; padding:5px 10px; border-radius:15px; display:flex; align-items:center; gap:5px; font-size:0.9rem;">
                ${s} <button onclick="removeStudent(${i})" style="border:none; background:none; cursor:pointer; font-weight:bold;">×</button>
            </span>`).join('');
        localStorage.setItem('students', JSON.stringify(students));
    }

    function addStudent() {
        const input = document.getElementById('nameInput');
        // Split by comma for multiple entries at once
        const names = input.value.split(',').map(n => n.trim()).filter(n => n !== "");
        if (names.length > 0) {
            students.push(...names);
            input.value = "";
            renderList();
        }
    }

    function removeStudent(index) {
        students.splice(index, 1);
        renderList();
    }

    function generateGroups() {
        const numGroups = parseInt(document.getElementById('groupCount').value);
        if (students.length === 0) return alert("Please add some students first!");
        if (numGroups < 1) return alert("Please enter a valid number of groups");

        // 1. Shuffle
        let shuffled = [...students].sort(() => 0.5 - Math.random());
        
        // 2. Create containers for the groups
        let results = Array.from({ length: numGroups }, () => []);

        // 3. "Deal" students into groups (Round Robin)
        shuffled.forEach((student, index) => {
            results[index % numGroups].push(student);
        });

        // 4. Display results
        document.getElementById('results').innerHTML = results.map((g, i) => 
            g.length > 0 ? `<div class="group-card"><strong>Group ${i+1}:</strong> ${g.join(', ')}</div>` : ""
        ).join('');
    }

    renderList();
</script>
